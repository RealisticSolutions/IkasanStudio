# Candidate preparation only. The first Marketplace submission is manual.
name: Community beta candidate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build and verify candidate
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test headless engine and packs
        run: ./gradlew -p headless cleanTest test
      - name: Test, package and verify plugin
        run: ./gradlew --no-configuration-cache cleanTest check buildPlugin verifyReleaseArchive verifyPlugin
      - name: Record archive checksums
        working-directory: build/distributions
        run: sha256sum *.zip > SHA256SUMS
      - name: Upload candidate and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: community-beta-candidate-${{ github.sha }}
          path: |
            build/distributions/*.zip
            build/distributions/SHA256SUMS
            build/reports/release/
            build/reports/pluginVerifier/
            build/reports/tests/
            headless/*/build/reports/tests/
          if-no-files-found: error
